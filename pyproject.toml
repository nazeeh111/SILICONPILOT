[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "siliconpilot"
version = "0.1.0"
description = "An inspectable ML-to-ECP5 hardware co-design laboratory"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [{name = "Nazeeh"}]
dependencies = ["numpy==2.4.2", "scipy==1.17.1", "scikit-learn==1.8.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "matplotlib==3.10.8"]

[project.scripts]
siliconpilot = "siliconpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
