name: Verify compiler and ECP5 flow
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned open FPGA tools
        shell: bash
        run: |
          curl -fL --retry 3 https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-10-25/oss-cad-suite-linux-x64-20261025.tgz -o "$RUNNER_TEMP/cad.tgz"
          echo '4de9b4fe89a368f765aa7fc25b9f71ec9b337a54d76166eafd9e810da90f781e  '"$RUNNER_TEMP/cad.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cad.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/oss-cad-suite/bin" >> "$GITHUB_PATH"
      - name: Install pinned Python dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Run contract, arithmetic, protocol and formal tests
        run: pytest -q
      - name: Check browser application syntax
        run: node --check observatory/app.js
      - name: Independently verify, synthesize and route a real model
        run: siliconpilot build models/banknote_4x8x2.json --out work/ci-ecp5 --dataset
